<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">oil-frontend</title>
  <desc id="desc">从用户任务出发，修改产品前端真正出错的位置。</desc>

  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#E7E4DC" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#171917" opacity=".22"/>
    </pattern>
    <clipPath id="heroBounds">
      <rect x="10" y="10" width="1180" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#heroBounds)">
    <rect width="1200" height="420" fill="#FBFAF6"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity=".7"/>
    <circle cx="110" cy="65" r="210" fill="#FFFFFF" opacity=".72"/>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
      <text x="66" y="126" fill="#171917" font-size="72" font-weight="700" letter-spacing="-2.6">oil-frontend</text>
      <rect x="64" y="149" width="526" height="18" rx="4" fill="#F3C95F" opacity=".9"/>
      <text x="66" y="174" fill="#171917" font-size="30" font-weight="650">从用户任务出发，修改真正出错的位置</text>

      <text x="66" y="228" fill="#4F534E" font-size="21" font-weight="430">删除无效内容，校准数据与状态，统一组件和代码归属。</text>
      <text x="66" y="262" fill="#4F534E" font-size="21" font-weight="430">完成迁移以后，同时清理旧实现和失效样式。</text>

      <g transform="translate(66 309)" font-size="17" font-weight="620">
        <rect width="150" height="38" rx="19" fill="#FFFFFF" stroke="#CFCBC1" stroke-width="1.5"/>
        <text x="75" y="25" fill="#343733" text-anchor="middle">任务与对象</text>
        <rect x="162" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#CFCBC1" stroke-width="1.5"/>
        <text x="237" y="25" fill="#343733" text-anchor="middle">状态与范围</text>
        <rect x="324" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#CFCBC1" stroke-width="1.5"/>
        <text x="399" y="25" fill="#343733" text-anchor="middle">代码与清理</text>
      </g>
    </g>

    <rect x="728" y="72" width="422" height="290" rx="40" fill="#F3C95F"/>
    <rect x="1035" y="88" width="92" height="92" rx="22" fill="url(#dots)"/>
    <path d="M754 337c74-33 142-36 204-9 53 23 102 24 168 1" fill="none" stroke="#171917" stroke-width="3" stroke-linecap="round" opacity=".22"/>
    <image x="690" y="-2" width="474" height="474" xlink:href="hero-subject.png" preserveAspectRatio="xMidYMid meet"/>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
      <rect x="960" y="352" width="182" height="38" rx="19" fill="#171917"/>
      <text x="1051" y="377" fill="#FFFFFF" font-size="16" font-weight="650" text-anchor="middle">前端改动自动启用</text>
    </g>
  </g>

  <rect x="10" y="10" width="1180" height="400" rx="28" fill="none" stroke="#CAC6BC" stroke-width="2"/>
</svg>
